# Uso local para probar el backend en condiciones parecidas a producción
# (mismo Dockerfile que se despliega en Coolify). Para desarrollo día a día
# con hot-reload seguí usando `npm run start:dev` directo, sin Docker.
#
#   docker compose up --build
#
services:
  backend:
    build: .
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: 7d
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pantera_store
      REDIS_URL: redis://redis:6379
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-51900000000}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # 5433 en el host (no 5432): esa máquina ya tiene un Postgres nativo de
    # Windows corriendo como servicio en el 5432 — usar el mismo puerto acá
    # terminaba conectando por accidente a ese Postgres nativo en vez de a
    # este contenedor (por eso el error de "password authentication failed").
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pantera_store
    volumes:
      - pantera_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - pantera_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pantera_postgres_data:
  pantera_redis_data:
